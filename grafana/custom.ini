app_mode = development

[paths]
# Plugins, provisioning, data and logs are supplied by tools/dev.sh through
# GF_PATHS_* environment variables, so this repo works from any folder.
# (Grafana resolves relative paths here against its own homepath, not the repo.)

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/
serve_from_sub_path = false

[plugins]
# Local plugins are not signed with a Grafana.com signature.
allow_loading_unsigned_plugins = omer-strokesquiz-panel,omer-strokesquiz-datasource
preinstall_disabled = true
public_key_retrieval_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[security]
admin_user = admin
admin_password = admin
allow_embedding = true

[log]
level = warn
mode = console
