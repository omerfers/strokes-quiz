app_mode = development

[paths]
plugins = /Users/omer/strokes-quiz/plugins
provisioning = /Users/omer/strokes-quiz/grafana/provisioning
data = /Users/omer/strokes-quiz/grafana/data
logs = /Users/omer/strokes-quiz/grafana/logs

[server]
protocol = http
http_addr = 127.0.0.1
http_port = 3000
domain = localhost
root_url = http://localhost:3000/
serve_from_sub_path = false

[plugins]
# Local plugins are not signed with a Grafana.com signature.
allow_loading_unsigned_plugins = omer-strokesquiz-panel,omer-strokesquiz-datasource
preinstall_disabled = true
public_key_retrieval_disabled = true

[analytics]
reporting_enabled = false
check_for_updates = false
feedback_links_enabled = false

[security]
admin_user = admin
admin_password = admin
allow_embedding = true

[log]
level = warn
mode = console
