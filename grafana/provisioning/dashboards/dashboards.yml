apiVersion: 1

providers:
  - name: strokes-quiz
    orgId: 1
    folder: ''
    type: file
    disableDeletion: false
    updateIntervalSeconds: 10
    allowUiUpdates: true
    options:
      # tools/dev.sh exports STROKES_DASHBOARDS so the repo can live anywhere.
      path: ${STROKES_DASHBOARDS}
      foldersFromFilesStructure: false
